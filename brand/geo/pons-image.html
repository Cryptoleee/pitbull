<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="geo.css"><style>
/* Token image for the Pons launch: the flexing creature on a gold sunburst. No text — the launchpad
   prints the name and ticker beside it. Decoration is hand-placed so nothing clumps at the edges. */
html, body { width: 1080px; height: 1080px; overflow: hidden; }
.m { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: radial-gradient(circle at 50% 46%, #fff3c4 0%, #ffd766 18%, #f5a92a 46%, #d07f12 72%, #8a4e06 100%); }
.rays { position: absolute; inset: -30%; background: repeating-conic-gradient(from 0deg, rgba(255,247,200,.72) 0deg 5deg, rgba(255,247,200,0) 5deg 13deg); }
.glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 44%, rgba(255,255,255,.5), rgba(255,255,255,0) 52%); }
.vignette { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 56%, rgba(90,45,0,.38) 100%); z-index: 8; }
.fig { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); height: 93%; z-index: 5; filter: drop-shadow(0 18px 30px rgba(90,45,0,.4)) drop-shadow(0 0 44px rgba(255,235,170,.5)) saturate(1.08) contrast(1.04); }
.d { position: absolute; display: grid; place-items: center; }
.d.coin { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff9c8, #ffd700 46%, #c98a00); border: 3px solid #7a5200; color: #7a5200; font-family: 'Anton', Impact, sans-serif; box-shadow: 4px 5px 0 rgba(120,70,0,.3); }
.d.buck { font-family: 'Anton', Impact, sans-serif; color: #12b312; text-shadow: -3px -3px 0 #0b3d0b, 3px -3px 0 #0b3d0b, -3px 3px 0 #0b3d0b, 3px 3px 0 #0b3d0b, 5px 6px 0 rgba(0,0,0,.25); }
.sp { position: absolute; width: 46px; height: 46px; transform: translate(-50%, -50%); background: radial-gradient(circle, #fff 0 4px, transparent 5px), conic-gradient(from 0deg, transparent 0 40deg, #fff 45deg, transparent 50deg, transparent 130deg, #fff 135deg, transparent 140deg, transparent 220deg, #fff 225deg, transparent 230deg, transparent 310deg, #fff 315deg, transparent 320deg); filter: drop-shadow(0 0 8px #fff8d0); }
</style></head><body><div class="m">
<div class="rays"></div><div class="glow"></div>
