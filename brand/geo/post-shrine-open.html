<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="geo.css"><style>
.m { position: relative; width: 1200px; height: 1200px; overflow: hidden; }
.construction.t { position: absolute; left: 0; right: 0; top: 0; height: 18px; border-width: 0 0 2px; z-index: 9; }
.construction.b { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; border-width: 2px 0 0; z-index: 9; }
.top { position: absolute; left: 0; right: 0; top: 34px; text-align: center; z-index: 8; }
.top .wordart { font-size: 104px; }
.top .sub { margin-top: 12px; }
.top .sub span { font-family: 'Arimo', Arial, sans-serif; font-weight: 700; font-size: 21px; color: #000080; background: #ffff00; border: 3px solid #000; padding: 4px 12px; }
.win.browser { position: absolute; left: 52px; right: 52px; top: 250px; z-index: 6; }
.win.browser .bar { font-size: 20px; }
.win.browser .addr { display: flex; align-items: center; gap: 8px; margin: 3px; padding: 6px 8px; background: #c0c0c0; font-family: 'Arimo', Arial, sans-serif; font-weight: 700; font-size: 18px; }
.win.browser .addr input { flex: 1; font: inherit; padding: 4px 8px; background: #fff; border: 2px inset #808080; }
.shot { margin: 3px; border: 2px inset #808080; overflow: hidden; height: 560px; }
.shot img { display: block; width: 100%; }
.cut { position: absolute; right: 18px; bottom: 60px; width: 330px; z-index: 7; filter: drop-shadow(8px 8px 0 rgba(0,0,0,.35)); }
.bubble { position: absolute; left: 58px; bottom: 150px; width: 520px; z-index: 8; background: #fff; border: 4px solid #000; border-radius: 22px; padding: 14px 18px; box-shadow: 6px 6px 0 rgba(0,0,0,.4); }
.bubble .comic { font-size: 30px; }
.bubble::after { content: ''; position: absolute; right: 60px; bottom: -32px; width: 0; height: 0; border: 17px solid transparent; border-top-color: #000; }
.foot { position: absolute; left: 0; right: 0; bottom: 48px; text-align: center; z-index: 9; }
.foot .u { font-family: 'Anton', Impact, sans-serif; font-size: 64px; color: #ffff00; text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000, 0 0 22px #ff00c8; }
.newburst { left: 26px; top: 30px; z-index: 9; }
</style></head><body><div class="m">
<div class="sky"></div><div class="faces"></div><div class="money-tile" style="opacity:.4"></div>
<div class="fx" id="fxback" style="z-index:2"></div>
<div class="construction t"></div><div class="construction b"></div>
<div class="top">
  <div class="wordart"><span class="ext">THE SHRINE IS OPEN</span><span class="fill">THE SHRINE IS OPEN</span></div>
  <div class="sub"><span>LIVE ON-CHAIN NUMBERS &nbsp;*&nbsp; 7 SIGNS &nbsp;*&nbsp; NO WALLET CONNECT, EVER</span></div>
</div>
<div class="win browser">
  <div class="bar"><span>NETSCAPE - [$PITBULL - the mythical creature that brings wealth]</span><span class="btns"><i>_</i><i>[]</i><i>X</i></span></div>
  <div class="addr"><span>Location:</span><input value="https://thepitbull.fun/" readonly></div>
  <div class="shot"><img src="site-shot.png"></div>
</div>
<img class="cut" src="cutout.png">
<div class="bubble"><div class="comic">my homepage is finished, mi gente. <b>go look at it.</b></div></div>
<div class="fx" id="fxfront" style="z-index:8"></div>
<div class="foot"><span class="u">thepitbull.fun</span></div>
<div class="newburst">NEW!</div>
<script src="geo-fx.js"></script>
<script>
geoRain('#fxback', 26, 51, { min: 42, max: 128 });
geoRain('#fxfront', 8, 18, { min: 36, max: 88, avoid: [{ x0: 2, y0: 18, x1: 98, y1: 74 }] });
geoSparkles('#fxfront', 10, 6, { avoid: [{ x0: 6, y0: 20, x1: 94, y1: 72 }] });
</script>
</div></body></html>
