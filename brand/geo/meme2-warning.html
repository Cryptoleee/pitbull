<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="geo.css"><style>
.m { position: relative; width: 1200px; height: 1200px; overflow: hidden; background: #000; }
.bg { position: absolute; inset: 0; }
.bg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.construction.t { position: absolute; left: 0; right: 0; top: 0; height: 18px; border-width: 0 0 2px; z-index: 8; }

.cursor { left: 366px; top: 642px; z-index: 7; }
.bottom { position: absolute; left: 0; right: 0; bottom: 106px; text-align: center; z-index: 8; }
.bottom .wordart { font-size: 132px; }
.foot { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; z-index: 8; }
.foot span { font-family: 'Arimo', Arial, sans-serif; font-weight: 700; font-size: 23px; color: #ffff00; background: rgba(0,0,0,.72); padding: 4px 14px; border: 2px solid #ffff00; }
</style></head><body><div class="m">
