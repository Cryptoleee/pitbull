<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
/* 12 s hype announcement, 1920x1080. Timeline driven by CSS animation delays; the recorder starts the clock on load. */
.poster { width: 1920px; height: 1080px; background: #000; }
* { animation-play-state: var(--paused, running); }
.art { animation: kb 10.5s cubic-bezier(.2,.6,.3,1) forwards, fadein .8s ease forwards; transform-origin: 50% 20%; }
.art img { object-position: 50% 8%; }
@keyframes kb { from { transform: scale(1.22); } to { transform: scale(1.02); } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.shade { background: linear-gradient(180deg, rgba(13,11,8,.25) 0%, rgba(13,11,8,0) 30%, rgba(13,11,8,0) 55%, rgba(13,11,8,.92) 100%); }
.flare { position: absolute; left: 50%; top: -100px; width: 1600px; height: 900px; transform: translateX(-50%); background: radial-gradient(ellipse at 50% 0%, rgba(255,235,190,.45), rgba(255,235,190,0) 60%); animation: pulse 3s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .5; } to { opacity: 1; } }
.line { position: absolute; left: 90px; opacity: 0; font-family: 'Inter', sans-serif; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--sand); font-size: 30px; text-shadow: 0 4px 24px rgba(0,0,0,.8); }
.l1 { top: 90px; animation: up .6s ease 1.4s forwards, out .4s ease 4.6s forwards; }
.l2 { top: 140px; animation: up .6s ease 2.6s forwards, out .4s ease 4.6s forwards; }
@keyframes up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes out { to { opacity: 0; } }
.big { position: absolute; left: 90px; bottom: 150px; opacity: 0; }
.big .h { font-size: 230px; }
.big { animation: slam .45s cubic-bezier(.1,.9,.2,1) 5s forwards, out .4s ease 8.9s forwards; }
@keyframes slam { 0% { opacity: 0; transform: scale(1.7); } 60% { opacity: 1; transform: scale(.96); } 100% { opacity: 1; transform: scale(1); } }
.tag { position: absolute; left: 96px; bottom: 90px; opacity: 0; font-size: 44px; animation: up .5s ease 6.9s forwards, out .4s ease 8.9s forwards; }
.url1 { position: absolute; right: 90px; bottom: 90px; opacity: 0; font-size: 56px; animation: up .5s ease 5.6s forwards, out .4s ease 8.9s forwards; }
.shake { position: absolute; inset: 0; animation: shake .5s ease 5.05s; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translate(-14px, 8px); } 40% { transform: translate(12px, -6px); } 60% { transform: translate(-8px, 4px); } 80% { transform: translate(6px, -3px); } }
.dust { position: absolute; inset: 0; pointer-events: none; opacity: 0; background-image: radial-gradient(circle, rgba(243,201,107,.9) 0 3px, transparent 4px), radial-gradient(circle, rgba(255,255,255,.7) 0 2px, transparent 3px); background-size: 230px 190px, 150px 270px; animation: dust 2.6s ease-out 5.05s forwards; }
@keyframes dust { 0% { opacity: 0; transform: translateY(60px) scale(1); } 15% { opacity: .9; } 100% { opacity: 0; transform: translateY(-220px) scale(1.15); } }
/* end card */
.card { position: absolute; inset: 0; background: var(--bg); opacity: 0; display: flex; align-items: center; justify-content: center; text-align: center; animation: fadein .5s ease 9.3s forwards; }
.card .bgimg { position: absolute; inset: 0; opacity: .22; }
.card .bgimg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; filter: blur(3px); }
.card .c { position: relative; }
.card .h { font-size: 270px; opacity: 0; animation: slam .45s cubic-bezier(.1,.9,.2,1) 9.5s forwards; }
.card .sub { font-size: 54px; margin-top: 8px; opacity: 0; animation: up .5s ease 10s forwards; }
.card .pill { font-size: 26px; margin-top: 34px; opacity: 0; animation: up .5s ease 10.3s forwards; }
.card .url { display: block; font-size: 76px; margin-top: 28px; opacity: 0; animation: up .5s ease 10.6s forwards; }
.dale { position: absolute; right: 120px; top: 110px; font-family: 'Anton', Impact, sans-serif; font-size: 140px; color: var(--gold2); letter-spacing: .1em; transform: rotate(-8deg); opacity: 0; text-shadow: 0 0 60px rgba(226,166,58,.7); animation: slam .4s cubic-bezier(.1,.9,.2,1) 11.2s forwards; }
</style></head><body><div class="poster">
<div class="shake">
<div class="art"><img src="../pitbull-ref.jpg"></div><div class="flare"></div><div class="shade"></div>
<div class="line l1">Somewhere on a desert road…</div>
<div class="line l2">a legend just stood up.</div>
<div class="big"><div class="h">Meet the<br>Pitbull</div></div>
<div class="sub tag">Half bull. Half pitbull. All star.</div>
<div class="url url1">thepitbull.fun</div>
<div class="dust"></div>
</div>
<div class="card"><div class="bgimg"><img src="../pitbull-ref.jpg"></div>
<div class="c"><div class="h">$PITBULL</div><div class="sub">The mythical creature that brings wealth</div><div class="pill"><i></i>Launching soon · Robinhood Chain · via Pons</div><span class="url">thepitbull.fun</span></div>
<div class="dale">DALE.</div></div>
<div class="grain"></div></div></body></html>
